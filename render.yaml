services:
  - type: web
    name: note-v4-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://placeholder.example.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false